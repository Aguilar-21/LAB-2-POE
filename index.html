<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de Estudiantes</title>
    <link rel="stylesheet" href="src/styles/styles.css" />
  </head>
  <body>
    <header class="cabecera">
      <h1>Registro de Estudiantes</h1>
    </header>

    <main class="contenedor">
      <section class="tarjeta" aria-labelledby="titulo-formulario">
        <h2 id="titulo-formulario">Datos del estudiante</h2>

        <form id="form-estudiante" novalidate>
          <div class="campo">
            <label for="codigo">Código *</label>
            <input
              type="text"
              id="codigo"
              name="codigo"
              placeholder="Ej: U20260520"
              autocomplete="off"
            />
            <small class="error" id="error-codigo"></small>
          </div>

          <div class="campo">
            <label for="nombre">Nombre completo *</label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              placeholder="Ej: María Pérez"
              autocomplete="off"
            />
            <small class="error" id="error-nombre"></small>
          </div>

          <div class="campo">
            <label for="email">Correo electrónico *</label>
            <input
              type="text"
              id="email"
              name="email"
              placeholder="Ej: maria.perez@correo.com"
              autocomplete="off"
            />
            <small class="error" id="error-email"></small>
          </div>

          <div class="campo">
            <label for="carrera">Carrera *</label>
            <select id="carrera" name="carrera"></select>
            <small class="error" id="error-carrera"></small>
          </div>

          <div class="campo">
            <label for="anio-ingreso">Año de ingreso *</label>
            <input
              type="number"
              id="anio-ingreso"
              name="anioIngreso"
              placeholder="Ej: 2024"
              min="1950"
              max="2100"
              autocomplete="off"
            />
            <small class="error" id="error-anio"></small>
          </div>

          <div class="acciones">
            <button type="submit" id="btn-guardar" class="btn btn-primario">
              Registrar
            </button>
            <button type="button" id="btn-cancelar" class="btn btn-secundario oculto">
              Cancelar edición
            </button>
          </div>
        </form>

        <div id="mensaje" class="mensaje oculto" role="status" aria-live="polite"></div>
      </section>

      <section class="tarjeta" aria-labelledby="titulo-listado">
        <div class="encabezado-listado">
          <h2 id="titulo-listado">Listado de estudiantes</h2>
          <span id="contador" class="contador">0 registros</span>
        </div>

        <div id="contador-carreras" class="contador-carreras"></div>

        <div class="barra-filtros">
          <input
            type="search"
            id="busqueda"
            placeholder="Buscar por código, nombre o correo..."
            autocomplete="off"
          />
          <select id="filtro-carrera" aria-label="Filtrar por carrera"></select>
          <select id="ordenar" aria-label="Ordenar">
            <option value="ninguno">Sin ordenar</option>
            <option value="nombre">Ordenar por nombre</option>
            <option value="codigo">Ordenar por código</option>
          </select>
          <button type="button" id="btn-exportar" class="btn btn-secundario">
            Exportar CSV
          </button>
        </div>

        <div class="tabla-contenedor">
          <table id="tabla-estudiantes">
            <thead>
              <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Carrera</th>
                <th>Año</th>
                <th class="col-acciones">Acciones</th>
              </tr>
            </thead>
            <tbody id="cuerpo-tabla">
              <!-- Filas generadas dinámicamente -->
            </tbody>
          </table>
          <p id="sin-resultados" class="sin-resultados oculto">
            No se encontraron estudiantes.
          </p>
        </div>
      </section>
    </main>

    <footer class="pie">
      <p>Proyecto académico &middot; Programación Orientada a Eventos</p>
    </footer>

    <div id="modal-credencial" class="modal oculto" role="dialog" aria-modal="true">
      <div class="modal-caja">
        <button type="button" id="modal-cerrar" class="modal-cerrar" aria-label="Cerrar">
          &times;
        </button>
        <h3>Credencial del estudiante</h3>
        <div id="modal-contenido"></div>
        <div id="modal-qr" class="modal-qr"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
    <script type="module" src="dist/main.js"></script>
  </body>
</html>
